apiVersion: v1
kind: Namespace
metadata: {name: mcp-servers}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus-mcp, namespace: mcp-servers}
---
# read-only: enough for get_pod_resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: prometheus-mcp}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [get, list]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: prometheus-mcp}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-mcp}
subjects: [{kind: ServiceAccount, name: prometheus-mcp, namespace: mcp-servers}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus-mcp, namespace: mcp-servers}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus-mcp}}
  template:
    metadata: {labels: {app: prometheus-mcp}}
    spec:
      serviceAccountName: prometheus-mcp
      containers:
        - name: server
          image: workshop/mcp-base:1
          imagePullPolicy: IfNotPresent # loaded into the kind node by bootstrap/up.sh
          command: [python, /app/server.py]
          ports: [{containerPort: 8000}]
          readinessProbe: {tcpSocket: {port: 8000}}
          volumeMounts: [{name: code, mountPath: /app}]
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
      volumes:
        - {name: code, configMap: {name: prometheus-mcp-code}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus-mcp, namespace: mcp-servers}
spec:
  selector: {app: prometheus-mcp}
  ports: [{port: 8000}]
