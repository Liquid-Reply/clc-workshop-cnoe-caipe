# Single-node workshop cluster. The agentgateway proxy listens on NodePort 30443 (platform/gateway.yaml);
# it is published on the laptop as https://*.caipe.localtest.me:8443, loopback only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
