# Platform ingress: one agentgateway proxy on NodePort 30443 (host 8443, see bootstrap/kind.yaml) for Gitea and Argo CD.
# The listener sets no hostname on purpose: macOS curl/git send no SNI when TLS verification is off, and a
# hostname-bound listener rejects those handshakes. Routing by host happens in the HTTPRoutes.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: platform
  namespace: agentgateway-system
spec:
  service:
    spec:
      type: NodePort
      ports:
        - port: 443
          nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: platform
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: platform-tls # self-signed *.caipe.localtest.me, created by up.sh
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: platform
      namespace: agentgateway-system
  hostnames: ["gitea.caipe.localtest.me"]
  rules:
    - backendRefs:
        - name: my-gitea-http
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform
      namespace: agentgateway-system
  hostnames: ["argocd.caipe.localtest.me"]
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
